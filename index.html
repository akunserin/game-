<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lomba Karung Tradisional Mewah</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #1a0505; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        .game-container {
            width: 100%; max-width: 600px; height: 100vh; max-height: 520px;
            background: linear-gradient(135deg, #fff8e7, #fdf5d6);
            border-radius: 12px; box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            position: relative; overflow: hidden; border: 4px solid #d4af37;
        }

        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #2c0909; color: #fdf5d6; padding: 20px; transition: 0.3s; z-index: 10; }
        .hidden { display: none !important; }

        .spinner { width: 50px; height: 50px; border: 5px solid rgba(212,175,55,0.3); border-top: 5px solid #d4af37; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        h1 { color: #d4af37; text-shadow: 2px 2px #5a1212; margin-bottom: 15px; font-size: 1.8rem; text-align: center; }
        
        .select-box { display: flex; gap: 15px; margin-bottom: 20px; width: 100%; justify-content: center; }
        .player-card { background: #451313; border: 2px solid #d4af37; padding: 12px; border-radius: 10px; text-align: center; width: 45%; }
        select { padding: 8px; font-size: 1rem; border-radius: 5px; background: #fff; width: 100%; margin-top: 5px; color: #000; }

        .btn-gold { background: linear-gradient(135deg, #f39c12, #d4af37); color: #2c0909; border: none; padding: 12px 25px; font-size: 1.1rem; border-radius: 25px; font-weight: bold; cursor: pointer; box-shadow: 0 5px 15px rgba(212,175,55,0.4); }
        .btn-gold:active { transform: scale(0.95); }

        /* GAMEPLAY */
        #game-screen { background: linear-gradient(to bottom, #87ceeb 60%, #557a2b 40%); justify-content: flex-start; padding: 0; z-index: 5; }
        .header-bar { width: 100%; background: #2c0909; color: #d4af37; padding: 10px; display: flex; justify-content: space-between; font-weight: bold; border-bottom: 3px solid #d4af37; font-size: 0.9rem; z-index: 6; }
        
        .track-area { position: relative; width: 100%; height: 240px; background: #e8d0aa; border-bottom: 5px solid #3e2723; overflow: hidden; }
        .finish-flag { position: absolute; right: 50px; top: 0; width: 8px; height: 100%; background: repeating-linear-gradient(0deg, #d4af37, #d4af37 15px, #2c0909 15px, #2c0909 30px); z-index: 2; }
        .finish-label { position: absolute; right: 20px; top: 10px; font-size: 0.75rem; font-weight: bold; color: #2c0909; background: #d4af37; padding: 2px 5px; border-radius: 4px; z-index: 3; }

        .runner-row { position: absolute; width: 100%; height: 110px; display: flex; align-items: center; }
        #row1 { top: 10px; border-bottom: 2px dashed #bcaaa4; }
        #row2 { top: 120px; }

        .runner-avatar { position: absolute; left: 15px; font-size: 2.2rem; transition: left 0.15s ease-out; z-index: 5; }
        .hop { animation: hopAnim 0.15s ease; }
        @keyframes hopAnim {
            0% { transform: translateY(0); }
            50% { transform: translateY(-18px) scale(1.1); }
            100% { transform: translateY(0); }
        }

        /* CONTROLS UNTUK HP & KOMPUTER */
        .controls-area { display: flex; width: 100%; height: 160px; background: #3e2723; z-index: 6; }
        .tap-btn { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 1.1rem; font-weight: bold; color: white; border: 2px solid #d4af37; cursor: pointer; user-select: none; text-align: center; line-height: 1.3; }
        #btn-p1 { background: #b71c1c; }
        #btn-p2 { background: #0d47a1; }
        .tap-btn:active { filter: brightness(1.3); transform: scale(0.98); }
        .key-hint { font-size: 0.75rem; opacity: 0.8; font-weight: normal; margin-top: 4px; }

        /* COUNTDOWN OVERLAY */
        #countdown-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); display: flex; justify-content: center; align-items: center; z-index: 20; }
        #countdown-text { font-size: 5rem; color: #f1c40f; font-weight: bold; text-shadow: 0 0 20px #d4af37; animation: pulseCount 0.8s infinite alternate; }
        @keyframes pulseCount { from { transform: scale(1); } to { transform: scale(1.15); } }

        /* CONFETTI */
        .confetti { position: absolute; width: 10px; height: 10px; background: #f1c40f; animation: fall 2s linear infinite; z-index: 25; }
        @keyframes fall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(500px) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- 1. LOADING SCREEN -->
        <div id="loading-screen" class="screen">
            <div class="spinner"></div>
            <h1>LOMBA KARUNG TRADISIONAL</h1>
            <p style="color: #d4af37;">Menyiapkan arena perlombaan...</p>
        </div>

        <!-- 2. MENU SCREEN -->
        <div id="menu-screen" class="screen hidden">
            <h1>JUARA LOMBA KARUNG</h1>
            <p style="margin-bottom: 15px; font-size: 0.95rem; text-align: center;">Pilih jagoanmu di dalam karung goni!</p>
            
            <div class="select-box">
                <div class="player-card">
                    <label style="color: #ff8a80; font-weight:bold;">Pemain 1</label>
                    <select id="char1">
                        <option value="🌾👧 Agustina">Agustina</option>
                        <option value="🌾👩 Serin">Serin</option>
                        <option value="🌾👱‍♀️ Luna">Luna</option>
                        <option value="🌾👦 Budi">Budi</option>
                    </select>
                </div>
                <div class="player-card">
                    <label style="color: #80d8ff; font-weight:bold;">Pemain 2</label>
                    <select id="char2">
                        <option value="🌾👩 Serin">Serin</option>
                        <option value="🌾👧 Agustina">Agustina</option>
                        <option value="🌾👱‍♀️ Luna">Luna</option>
                    </select>
                </div>
            </div>

            <button class="btn-gold" onclick="startCountdown()">MULAI LOMBA 🇮🇩</button>
            <p style="margin-top: 15px; font-size: 0.75rem; color: #d4af37; text-align: center;">PC: Spasi (P1) & Tombol L (P2) | HP: Tap Tombol</p>
        </div>

        <!-- 3. GAMEPLAY SCREEN -->
        <div id="game-screen" class="screen hidden">
            <div id="countdown-overlay" class="hidden">
                <div id="countdown-text">3</div>
            </div>

            <div class="header-bar">
                <span id="p1-label">P1: Agustina</span>
                <span>GARIS FINISH</span>
                <span id="p2-label">P2: Serin</span>
            </div>

            <div class="track-area">
                <div class="finish-flag"></div>
                <div class="finish-label">FINISH</div>
                <div id="row1" class="runner-row">
                    <div id="runner1" class="runner-avatar">🌾👧</div>
                </div>
                <div id="row2" class="runner-row">
                    <div id="runner2" class="runner-avatar">🌾👩</div>
                </div>
            </div>

            <div class="controls-area">
                <div id="btn-p1" class="tap-btn" ontouchstart="moveP1()" onclick="moveP1()">
                    TAP P1<br>(Merah)
                    <span class="key-hint">Keyboard: [SPASI]</span>
                </div>
                <div id="btn-p2" class="tap-btn" ontouchstart="moveP2()" onclick="moveP2()">
                    TAP P2<br>(Biru)
                    <span class="key-hint">Keyboard: [L]</span>
                </div>
            </div>
        </div>

        <!-- 4. GAME OVER -->
        <div id="gameover-screen" class="screen hidden">
            <h1 id="winner-title" style="color: #f1c40f;">PEMENANG!</h1>
            <p id="winner-desc" style="text-align: center; margin-bottom: 20px; font-size: 1.1rem;"></p>
            <button class="btn-gold" onclick="location.reload()">MAIN LAGI</button>
        </div>
    </div>

    <script>
        setTimeout(() => {
            document.getElementById('loading-screen').classList.add('hidden');
            document.getElementById('menu-screen').classList.remove('hidden');
        }, 1500);

        let p1Pos = 15;
        let p2Pos = 15;
        let p1Name = "Agustina", p2Name = "Serin";
        let p1Avatar = "🌾👧", p2Avatar = "🌾👩";
        let isPlaying = false;
        const finishLine = 430; 

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, type, duration) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function startCountdown() {
            let c1 = document.getElementById('char1').value.split(" ");
            let c2 = document.getElementById('char2').value.split(" ");
            
            p1Avatar = c1[0]; p1Name = c1[1];
            p2Avatar = c2[0]; p2Name = c2[1];

            document.getElementById('p1-label').innerText = `P1: ${p1Name}`;
            document.getElementById('p2-label').innerText = `P2: ${p2Name}`;
            document.getElementById('runner1').innerText = p1Avatar;
            document.getElementById('runner2').innerText = p2Avatar;

            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            
            let countOverlay = document.getElementById('countdown-overlay');
            let countText = document.getElementById('countdown-text');
            countOverlay.classList.remove('hidden');

            let count = 3;
            countText.innerText = count;
            playSound(400, 'sine', 0.3);

            let timer = setInterval(() => {
                count--;
                if (count > 0) {
                    countText.innerText = count;
                    playSound(400, 'sine', 0.3);
                } else if (count === 0) {
                    countText.innerText = "MULAII!";
                    playSound(800, 'square', 0.5);
                } else {
                    clearInterval(timer);
                    countOverlay.classList.add('hidden');
                    p1Pos = 15; p2Pos = 15;
                    document.getElementById('runner1').style.left = p1Pos + 'px';
                    document.getElementById('runner2').style.left = p2Pos + 'px';
                    isPlaying = true;
                }
            }, 1000);
        }

        function moveP1() {
            if (!isPlaying) return;
            p1Pos += 20;
            let el = document.getElementById('runner1');
            el.style.left = p1Pos + 'px';
            triggerHop(el);
            playSound(300, 'triangle', 0.1);
            checkWin();
        }

        function moveP2() {
            if (!isPlaying) return;
            p2Pos += 20;
            let el = document.getElementById('runner2');
            el.style.left = p2Pos + 'px';
            triggerHop(el);
            playSound(350, 'triangle', 0.1);
            checkWin();
        }

        function triggerHop(element) {
            element.classList.remove('hop');
            void element.offsetWidth;
            element.classList.add('hop');
        }

        window.addEventListener('keydown', (e) => {
            if (!isPlaying) return;
            if (e.code === 'Space') {
                e.preventDefault();
                moveP1();
            } else if (e.code === 'KeyL' || e.code === 'ArrowRight') {
                e.preventDefault();
                moveP2();
            }
        });

        function checkWin() {
            if (!isPlaying) return;
            if (p1Pos >= finishLine) {
                isPlaying = false;
                showWinner(p1Name, p1Avatar);
            } else if (p2Pos >= finishLine) {
                isPlaying = false;
                showWinner(p2Name, p2Avatar);
            }
        }

        function showWinner(name, avatar) {
            playSound(600, 'sine', 0.8);
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('gameover-screen').classList.remove('hidden');
            document.getElementById('winner-title').innerText = `🏆 ${avatar} ${name} JUARA! 🏆`;
            document.getElementById('winner-desc').innerText = `${name} berhasil melompat paling cepat di dalam karung goni dan memenangkan perlombaan!`;
            createConfetti();
        }

        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                let confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * window.innerWidth + 'px';
                confetti.style.backgroundColor = ['#f1c40f', '#e74c3c', '#3498db', '#2ecc71', '#9b59b6'][Math.floor(Math.random() * 5)];
                confetti.style.animationDuration = (Math.random() * 2 + 1) + 's';
                confetti.style.animationDelay = Math.random() + 's';
                document.body.appendChild(confetti);
            }
        }
    </script>
</body>
</html>
